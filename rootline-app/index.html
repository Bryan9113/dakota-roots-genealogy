function __rn(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function __parseMaster(txt){const L=String(txt||'').split(/\\r?\\n/),P={},F={};let c=null,m='',e='';for(const l of L){let z=l.match(/^0\\s+(@I[^@]+@)\\s+INDI/);if(z){c=z[1];m='i';e='';P[c]={g:c,n:'Unknown',b:'',d:'',bp:'',dp:''};continue}z=l.match(/^0\\s+(@F[^@]+@)\\s+FAM/);if(z){c=z[1];m='f';e='';F[c]={h:'',w:'',c:[]};continue}if(/^0\\s/.test(l)){c=null;m='';continue}if(!c)continue;if(m==='i'){const p=P[c];if(l.startsWith('1 NAME '))p.n=l.slice(7).replaceAll('/',' ').replace(/\\s+/g,' ').trim();else if(l==='1 BIRT')e='b';else if(l==='1 DEAT')e='d';else if(l.startsWith('2 DATE '))p[e]=l.slice(7).trim();else if(l.startsWith('2 PLAC '))p[e+'p']=l.slice(7).trim()}else{const f=F[c];if(l.startsWith('1 HUSB '))f.h=l.slice(7).trim();else if(l.startsWith('1 WIFE '))f.w=l.slice(7).trim();else if(l.startsWith('1 CHIL '))f.c.push(l.slice(7).trim())}}const pa={},sp={},ch={};Object.keys(P).forEach(k=>pa[k]=sp[k]=ch[k]=[]);for(const f of Object.values(F)){const a=[f.h,f.w].filter(x=>P[x]);if(a.length===2){sp[a[0]].push(a[1]);sp[a[1]].push(a[0])}for(const k of f.c)if(P[k])for(const x of a){pa[k].push(x);ch[x].push(k)}}return Object.values(P).map(p=>{const id='ged_'+p.g.replace(/\\W/g,'');const R=[];for(const x of pa[p.g])R.push({text:'Parent: '+P[x].n,target:'ged_'+x.replace(/\\W/g,'')});for(const x of sp[p.g])R.push({text:'Spouse: '+P[x].n,target:'ged_'+x.replace(/\\W/g,'')});for(const x of ch[p.g])R.push({text:'Child: '+P[x].n,target:'ged_'+x.replace(/\\W/g,'')});const E=[];if(p.b||p.bp)E.push([p.b,'• Birth',p.bp].filter(Boolean).join(' '));if(p.d||p.dp)E.push([p.d,'• Death',p.dp].filter(Boolean).join(' '));return{id,name:p.n,meta:[[p.b,p.d].filter(Boolean).join(' – '),[p.bp&&'Born '+p.bp,p.dp&&'Died '+p.dp].filter(Boolean).join(' • ')].filter(Boolean).join('\\n')||'Bryan Olson Master Family Tree 2026',confidence:'Unverified',relations:R,events:E,gaps:[],sources:['Bryan Olson Master Family Tree 2026 • GEDCOM import — verify key links against original records.']}})}

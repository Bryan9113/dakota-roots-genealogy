<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Rootline AI Genealogy</title>
  <style>
    html,body{margin:0;background:#070707;color:#f4e7c9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
    .boot{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 70% 20%,rgba(136,93,220,.22),transparent 30%),radial-gradient(circle at 25% 70%,rgba(215,177,103,.14),transparent 28%),#070707}
    .mark{font-family:Georgia,serif;font-size:34px;color:#e0bd76}
    h1{font-size:clamp(38px,8vw,64px);line-height:1.05;max-width:760px;margin:28px auto}
    .boot p{color:#a89d8d;max-width:520px;line-height:1.6;margin-left:auto;margin-right:auto}
    .spin{width:44px;height:44px;border-radius:50%;border:2px solid rgba(217,181,109,.18);border-top-color:#d9b56d;margin:22px auto;animation:s .9s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    .status{font-size:13px;color:#d9b56d;min-height:20px}
    .err{color:#ff9f9f;white-space:pre-wrap;max-width:620px;margin:18px auto 0;font-weight:700}
  </style>
</head>
<body>
  <div class="boot">
    <div>
      <div class="mark">⌁ Rootline AI Genealogy</div>
      <h1>Your Family. Our Mission. AI-Powered.</h1>
      <div class="spin"></div>
      <p>Opening the private AI genealogy research OS and loading the master family tree.</p>
      <div id="status" class="status">Preparing Rootline…</div>
      <div id="err" class="err"></div>
    </div>
  </div>
<script>
const OWNER_HASH='187f94ae35e51156e4bbfdd1e6b989d9022019cd183b12d154f6c740e4f082a0';
const statusEl=document.getElementById('status');
const errEl=document.getElementById('err');
function status(s){statusEl.textContent=s}
async function fetchText(path){
  const r=await fetch(path,{cache:'no-store'});
  const text=await r.text();
  if(!r.ok)throw Error(text || ('Could not load '+path+' ('+r.status+')'));
  return text;
}
function stitch(parts){
  if(!parts.length)return '';
  let out=String(parts[0]||'').trim();
  for(let i=1;i<parts.length;i++){
    const next=String(parts[i]||'').trim();
    if(!next)continue;
    let overlap=0;
    const probeLen=Math.min(96,next.length);
    const probe=next.slice(0,probeLen);
    const pos=out.lastIndexOf(probe);
    if(pos>=0){
      const possible=out.length-pos;
      if(possible>0&&possible<=next.length&&out.slice(pos)===next.slice(0,possible)) overlap=possible;
    }
    out+=next.slice(overlap);
  }
  return out.replace(/\s+/g,'');
}
async function gunzipB64Text(b64){
  if(!('DecompressionStream' in window))throw Error('This browser does not support gzip decoding. Please open Rootline in current Safari or Chrome.');
  const clean=String(b64||'').replace(/\s+/g,'');
  const bytes=Uint8Array.from(atob(clean),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text();
}
(async()=>{
  let stage='starting';
  try{
    stage='loading Rootline application';
    status('Loading Rootline application…');
    const appParts=await Promise.all([...Array(8)].map((_,i)=>fetchText('./payload/v5/'+String(i).padStart(2,'0')+'.txt')));
    const appB64=stitch(appParts);
    stage='decoding Rootline application';
    status('Decoding Rootline application…');
    let html=await gunzipB64Text(appB64);

    stage='loading master family tree from server';
    status('Loading 2,284-person master family tree…');
    const ged=await fetchText('/api/rootline-tree');
    if(!/\b0\s+HEAD\b/.test(ged) || !/\b0\s+TRLR\b/.test(ged)) throw Error('The server returned an incomplete GEDCOM file.');

    const gedUrl=URL.createObjectURL(new Blob([ged],{type:'text/plain;charset=utf-8'}));
    html=html.replaceAll('./data/Bryan_Olson_MASTER_ALL_USABLE_FAMILY_2026.ged',gedUrl);
    html=html.replace(/const __OWNER_SHA256__ = '[0-9a-f]+';/,`const __OWNER_SHA256__ = '${OWNER_HASH}';`);
    html=html.replace('</head>','<meta name="rootline-build" content="2026-08-20-server-tree-decode"></head>');

    stage='opening Rootline';
    status('Opening Rootline…');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('Rootline startup failed during '+stage,e);
    statusEl.textContent='';
    errEl.textContent='Rootline could not start during '+stage+': '+(e&&e.message?e.message:String(e));
  }
})();
</script>
</body>
</html>
